name: Test foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Linux build
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '0'
        run: go build -o dist/controlplane ./cmd/controlplane
