name: Test foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Linux build
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '0'
        run: go build -o dist/controlplane ./cmd/controlplane

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Enable pnpm from packageManager
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp check
      - run: pnpm exec vp test
      - run: pnpm exec vp build
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true
      - name: Build control plane with the web UI
        working-directory: .
        env:
          CGO_ENABLED: '0'
        run: |
          go test ./internal/controlplane/
          go build -o dist/controlplane ./cmd/controlplane
          go build -o dist/agent ./cmd/agent
          go build -o dist/devcert ./scripts/devcert
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - name: Package Linux archive
        working-directory: .
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}
        run: bash scripts/package.sh "$VERSION"
      # A second build with another version string, used only to check updates.
      - name: Build update-check binary
        working-directory: .
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ format('check-{0}', github.sha) }}
        run: go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o dist/update-check/amuos-controlplane ./cmd/controlplane
      - uses: actions/upload-artifact@v5
        with:
          name: update-check
          path: dist/update-check/amuos-controlplane
          retention-days: 7
      - uses: actions/upload-artifact@v5
        with:
          name: linux-amd64
          path: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
          retention-days: 14

  foundation:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true
      - name: Authorization, concurrent operations, retention volume and recovery
        shell: bash
        run: |
          set -o pipefail
          go test -v -count=1 -timeout=10m ./internal/controlplane ./internal/store ./internal/recovery -run '^TestFoundation' 2>&1 | tee foundation-results.txt
      - name: Capacity failure on a bounded filesystem
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check-foundation-capacity.sh 2>&1 | tee foundation-capacity.txt
      - name: Dependency vulnerability check
        shell: bash
        run: |
          set -o pipefail
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... 2>&1 | tee foundation-vulnerabilities.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: foundation-${{ matrix.os }}
          path: foundation-*.txt
          retention-days: 14

  # Install the archive by following docs/INSTALL.md on the supported systems.
  install-ubuntu:
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: linux-amd64
          path: release
      - run: cd release && sha256sum -c SHA256SUMS
      - run: bash scripts/smoke-install.sh release/*.tar.gz
        env:
          AMUOS_EXPORT_BACKUP: ${{ runner.temp }}/exported-backup
      # Dummy test data only: the owner password and recovery key exist for this check.
      - uses: actions/upload-artifact@v5
        with:
          name: exported-backup
          path: ${{ runner.temp }}/exported-backup
          retention-days: 1
      - uses: actions/download-artifact@v5
        with:
          name: update-check
          path: update-check
      - name: Install as a systemd service, update and roll back
        run: sudo bash scripts/smoke-systemd.sh release/*.tar.gz update-check/amuos-controlplane

  install-debian:
    needs: web
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl openssl
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: linux-amd64
          path: release
      - run: cd release && sha256sum -c SHA256SUMS
      - run: bash scripts/smoke-install.sh release/*.tar.gz

  # Restore the Ubuntu backup on a different system that has never run AmuOS.
  restore-debian:
    needs: install-ubuntu
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl openssl
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: linux-amd64
          path: release
      - uses: actions/download-artifact@v5
        with:
          name: exported-backup
          path: exported-backup
      - run: cd release && sha256sum -c SHA256SUMS
      - run: bash scripts/smoke-restore.sh release/*.tar.gz exported-backup

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec vp build
        working-directory: web
      - name: Build and package Windows
        shell: pwsh
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}
        run: |
          ./scripts/package-windows.ps1 -Version $env:VERSION
          ./scripts/package-windows.ps1 -Version "check-${{ github.sha }}"
          go build -o dist/devcert.exe ./scripts/devcert
          $name = 'amuos_' + $env:VERSION.TrimStart('v') + '_windows_amd64'
          $update = 'amuos_check-${{ github.sha }}_windows_amd64'
          ./scripts/smoke-windows.ps1 -Package "dist/windows-release/$name" -UpdatePackage "dist/windows-release/$update"
          Copy-Item "dist/windows-release/$name/amuos-controlplane.exe" dist/controlplane.exe
          Copy-Item "dist/windows-release/$name/amuos-agent.exe" dist/agent.exe
          New-Item -ItemType Directory dist/windows-publish
          Copy-Item "dist/windows-release/$name.zip" dist/windows-publish/
          $hash = (Get-FileHash "dist/windows-release/$name.zip").Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/dist/windows-publish/SHA256SUMS", "$hash  $name.zip`n", [Text.UTF8Encoding]::new($false))
      - run: pnpm exec playwright install chromium
        working-directory: web
      - run: pnpm exec playwright test
        working-directory: web
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v5
        with:
          name: windows-amd64
          path: dist/windows-publish/*
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [go, web, foundation, windows-release, install-ubuntu, install-debian, restore-debian]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: linux-amd64
          path: release/linux
      - uses: actions/download-artifact@v5
        with:
          name: windows-amd64
          path: release/windows
      - name: Combine checksums
        run: cat release/linux/SHA256SUMS release/windows/SHA256SUMS > release/SHA256SUMS
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/linux/*.tar.gz release/windows/*.zip release/SHA256SUMS
          --title "AmuOS $GITHUB_REF_NAME"
          --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          --prerelease --verify-tag
